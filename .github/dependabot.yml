version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    groups:
      toolchain:
        patterns: ["*"]
    ignore:
      # check-wheel-contents pins wheel-filename~=1.1; a 2.x lock is unresolvable.
      - dependency-name: wheel-filename
        versions: [">=2"]
    commit-message:
      prefix: deps
