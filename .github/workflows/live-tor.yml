name: Live Tor

# Exercises a real Tor client and the Tor network. Network-dependent by nature, so it runs
# weekly and on demand rather than gating pull requests.
on:
  schedule:
    - cron: "41 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-tor
  cancel-in-progress: true

jobs:
  live:
    name: Live tests against Tor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Tor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tor
          sudo systemctl stop tor || true
          tor --version | head -n 1
      - name: Install hash-pinned toolchain
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Live suite against a private Tor instance
        run: PYTHON=python scripts/live-tor.sh
