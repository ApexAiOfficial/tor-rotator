# Uses the hash-pinned toolchain from requirements/dev.txt (no extra downloads).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: python -m mypy
        language: system
        pass_filenames: false
        files: ^src/
