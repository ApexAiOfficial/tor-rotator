# systemd-sysusers(8): dedicated, login-less service account.
# Install as /etc/sysusers.d/tor-rotator.conf, then run `systemd-sysusers`.
# The `m` line grants access to Tor's control socket and auth cookie on Debian/Ubuntu;
# change the group for distributions that use a different Tor group.
u tor-rotator - "Tor Rotator" /var/lib/tor-rotator /usr/sbin/nologin
m tor-rotator debian-tor
