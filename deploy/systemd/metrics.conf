# Drop-in: let the hardened unit write Prometheus textfile-collector metrics.
#
# Install as:
#   /etc/systemd/system/tor-rotator.service.d/metrics.conf
#   /etc/systemd/system/tor-rotator-rotate.service.d/metrics.conf   (timer variant)
# and set in the config:
#   [runtime]
#   metrics_file = "/var/lib/prometheus/node-exporter/tor_rotator.prom"
#
# The directory must exist and be writable by the tor-rotator account, for example:
#   install -d -m 2775 -g tor-rotator /var/lib/prometheus/node-exporter
# (adjust the path to your node_exporter --collector.textfile.directory).

[Service]
ReadWritePaths=/var/lib/prometheus/node-exporter
