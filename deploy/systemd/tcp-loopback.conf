# Drop-in for TCP ControlPort/SocksPort on loopback (mode = "tcp" in the config).
#
# Install as:
#   /etc/systemd/system/tor-rotator.service.d/tcp-loopback.conf
#   /etc/systemd/system/tor-rotator-rotate.service.d/tcp-loopback.conf   (timer variant)
#
# The service still cannot reach anything but loopback: cgroup IP filtering allows only
# localhost, so every external connection must go through Tor's SOCKS listener.

[Service]
PrivateNetwork=no
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
IPAddressDeny=any
IPAddressAllow=localhost
