# Tor-side integration for tor-rotator on systems WITHOUT Debian's packaged defaults.
#
# Debian/Ubuntu: you do not need this file. The packaged defaults already provide a
# ControlSocket at /run/tor/control, a SOCKS socket at /run/tor/socks and group-readable
# SAFECOOKIE authentication; use deploy/config.debian.toml.
#
# Elsewhere, merge these settings into your torrc (Tor only reads a torrc.d directory if
# your torrc contains e.g. "%include /etc/tor/torrc.d/*.conf"), then validate and restart
# Tor as a deployment operation:
#   tor --verify-config -f /etc/tor/torrc
#   systemctl restart tor
#
# Do not declare a second SocksPort for an address/port that is already bound: Tor refuses
# to start. IsolateSOCKSAuth is enabled by default on SocksPort listeners, which is what
# keeps tor-rotator's verification probes on their own circuits; do not add
# NoIsolateSOCKSAuth.

# Preferred: a UNIX control socket, access controlled by filesystem permissions.
ControlSocket /run/tor/control GroupWritable RelaxDirModeCheck
# Alternative: a loopback-only TCP control port (tor-rotator refuses non-loopback hosts).
#ControlPort 127.0.0.1:9051

# SAFECOOKIE (cookie) authentication, readable by Tor's group only. Never world-readable.
CookieAuthentication 1
CookieAuthFileGroupReadable 1
CookieAuthFile /run/tor/control.authcookie

# Optional UNIX SOCKS socket (lets the systemd unit run with PrivateNetwork=yes).
#SocksPort unix:/run/tor/socks WorldWritable

# Reject SOCKS requests that carry an IP address instead of a hostname, which indicates an
# application resolved DNS locally (outside Tor).
SafeSocks 1
